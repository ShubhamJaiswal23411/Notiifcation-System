spring.application.name=notificationservice
# Datasource Configuration
spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG


app.jwt.secret=${JWT_SECRET:K7xP2mQ9vL4nR8tY3wZ6bH1cF5jN0aE7sD9gU2iX4oM6qA8rT1yW3zB5nC7v}
app.jwt.expiration-ms=3600000

app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@notify.local}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
